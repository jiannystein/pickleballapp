<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#6366f1"/>

  <!-- Pickleball (wiffle ball with holes) -->
  <circle cx="256" cy="256" r="160" fill="#ffffff" opacity="0.95"/>

  <!-- Ball holes pattern - distinctive pickleball look -->
  <!-- Row 1 -->
  <circle cx="200" cy="170" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="256" cy="155" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="312" cy="170" r="18" fill="#6366f1" opacity="0.3"/>

  <!-- Row 2 -->
  <circle cx="170" cy="225" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="228" cy="218" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="284" cy="218" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="342" cy="225" r="18" fill="#6366f1" opacity="0.3"/>

  <!-- Row 3 (center) -->
  <circle cx="185" cy="280" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="256" cy="275" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="327" cy="280" r="18" fill="#6366f1" opacity="0.3"/>

  <!-- Row 4 -->
  <circle cx="200" cy="335" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="256" cy="340" r="18" fill="#6366f1" opacity="0.3"/>
  <circle cx="312" cy="335" r="18" fill="#6366f1" opacity="0.3"/>

  <!-- Paddle handle accent (bottom right) -->
  <rect x="340" y="340" width="28" height="100" rx="14" fill="#4f46e5" transform="rotate(45 354 390)" opacity="0.85"/>

  <!-- Paddle head accent -->
  <ellipse cx="320" cy="320" rx="55" ry="70" fill="#4f46e5" transform="rotate(45 320 320)" opacity="0.15"/>
</svg>
